*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:3px}.shell{max-width:1370px;margin:auto;padding:30px}.mast{display:flex;justify-content:space-between;gap:24px;align-items:center;border-bottom:1px solid #d7dbe2;padding-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#69717c;margin:0 0 9px}h1{font-size:24px;font-weight:650;margin:0;letter-spacing:-.04em}.stamp{font-size:12px;color:#596170;line-height:1.8;text-align:right}.rule{margin:20px 0 0;padding:13px 17px;border-left:3px solid #1755e9;background:#e7edff;color:#1d439d;font-size:13px;line-height:1.7}.workbench{display:grid;grid-template-columns:180px minmax(330px,1fr) 275px;gap:38px;padding-top:28px;align-items:start}.rail h2,.notes h2{font-size:13px;margin:0 0 17px}.rail button{display:flex;width:100%;padding:11px 5px;text-align:left;background:none;color:#66707e;gap:14px;border-bottom:1px solid #dfe2e7;font-size:13px}.rail button b{font-size:10px;font-weight:400;align-self:center;font-variant-numeric:tabular-nums}.rail button[aria-current=page]{color:#1755e9;font-weight:650}.hint{font-size:11px;line-height:1.9;color:#69717c;margin-top:22px}.preview{display:flex;flex-direction:column;align-items:center;min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;max-width:430px;margin-bottom:14px;font-size:11px;color:#66707e}.toolbar select{font-size:11px;border:1px solid #cbd1dc;border-radius:4px;background:#fff;padding:6px}.phone{width:390px;max-width:100%;height:774px;background:var(--page);color:var(--text);border:1px solid #cfd5df;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px #2733430a;display:flex;flex-direction:column}.samplebar{height:29px;flex:none;padding:10px 18px 0;font-size:10px;color:var(--muted);di e:25px;margin:8px 0;font-weight:650;letter-spacing:-.045em}.hero p{font-size:12px;line-height:1.9;color:var(--muted);margin:10px 0 16px}.mini{display:flex;gap:22px;font-size:11px;color:var(--muted);margin-bottom:18px}.mini b{color:var(--text);font-size:17px;margin-right:4px}.actions{display:flex;gap:10px}.actions .btn{flex:1}.btn{display:flex;justify-content:center;align-items:center;min-height:47px;padding:10px 14px;background:var(--primary);color:var(--on);border-radius:7px;font-size:13px;font-weight:600;gap:7px}.btn.secondary{background:var(--soft);color:var(--primary)}.full{width:100%}.foot{flex:none;padding:14px 20px 22px;border-top:1px solid var(--border);background:var(--page)}.foot .small{text-align:center;margin:10px 0 0}.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 0;border-bottom:1px solid var(--border);font-size:12px}.choice span{color:var(--muted);font-size:11px}.choice select{background:var(--page);color:var(--text);border:1px solid var(--border);padding:5px;font-size:11px;max-width:200px}.notice{font-size:11px;line-height:1.9;padding:12px;background:var(--surface);color:var(--muted);border-radius:5px;margin-top:20px}.label{font-size:10px;letter-spacing:.06em;color:var(--muted)}.bignum{font-size:51px;letter-spacing:-.055em;margin:12px 0 8px;font-variant-numeric:tabular-nums}.bignum span{font-size:16px;color:var(--muted);letter-spacing:0}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:24px 0}.stats strong{font-size:25px;font-weight:650;display:block;margin-top:8px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.stats strong span{font-size:11px;color:var(--muted);font-weight:400}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:18px}.calendar button,.calendar span{display:grid;place-items:center;aspect-ratio:1;font-size:12px;border-radius:5px;background:none;color:var(--text)}.calendar .weekday{font-size:10px;color:var(--muted)}.calendar .learned{background:var(--soft);color:var(--primary)}.calendar .today{background:var(--primary);color:var(--on)}.noteblock{border-left:2px solid #1755e9;padding-left:13px;margin-bottom:26px}.noteblock h3{font-size:13px;margin:0 0 8px}.noteblock p{font-size:12px;line-height:1.95;color:#66707e;margin:0}.route{font-size:12px;line-height:1.95;color:#66707e;border-top:1px solid #d7dbe2;padding-top:18px}.route b{display:block;color:#20242d;font-size:13px;margin-bottom:8px}.screenlabel{font-size:11px;color:#77808c;margin-top:15px}.empty{text-align:center;padding:60px 0;color:var(--muted);font-size:13px;line-height:2}.formfield{display:flex;flex-direction:column;gap:10px;margin:20px 0;font-size:12px}.formfield input,.formfield textarea{border:1px solid var(--border);padding:12px;border-radius:6px;background:var(--page);color:var(--text)}.check{width:17px;height:17px;accent-color:var(--primary)}.timeline{border-left:1px solid var(--border);padding-left:16px;margin-top:18px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin-right:6px}.progress{height:5px;background:var(--surface);margin:12px 0 5px}.progress i{display:block;height:100%;background:var(--primary)}dialog{max-width:430px;border:1px solid #d7dbe2;border-radius:10px;padding:24px;background:var(--page);color:var(--text)}dialog::backdrop{background:#15192270}dialog h2{font-size:18px;margin-top:0}dialog p{font-size:13px;line-height:1.9;color:var(--muted)}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
@media(max-width:1100px){.workbench{grid-template-columns:160px minmax(320px,1fr);gap:24px}.notes{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:18px}.notes h2,.notes .route{grid-column:1/-1}}@media(max-width:650px){.shell{padding:18px 12px}.mast{align-items:flex-start}h1{font-size:20px}.stamp{font-size:10px}.rule{font-size:12px}.workbench{display:flex;flex-direction:column;padding-top:18px;gap:20px}.rail{width:100%;display:flex;gap:6px;overflow-x:auto}.rail h2,.rail .hint{display:none}.rail button{width:auto;white-space:nowrap;padding:10px 9px;border:1px solid #dfe2e7;border-radius:5px}.rail button b{display:none}.preview{width:100%}.phone{height:740px;border-radius:14px}.notes{display:block}.notes h2{margin-bottom:22px}.noteblock{margin-bottom:18px}.toolbar{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body>
<main class="shell">
<header class="mast"><div><p class="eyebrow">FONT STUDY · NEW MODULES ONLY / 2026.11.03</p><h1>只设计尚未存在的功能页面</h1></div><div class="stamp">设计评审稿 v2<br>示例数据 · 尚未实现</div></header>
<p class="rule"><strong>现有 UI 保持原样。</strong> 首页、计划、字体管理、文字详情、答题、关卡、复习和阅读器不重画；这里只展示缺失页面。点击涉及已有页面的操作时，仅说明复用边界。</p>
<div class="workbench">
<nav class="rail" aria-label="新增页面草图"><h2>新增页面流程</h2><div id="screen-nav"></div><p class="hint">点击手机里的按钮可进入关联新页面。<br><br>保留现有应用入口的位置与名称，只接通功能。</p></nav>
<section class="preview" aria-label="新增页面预览"><div class="toolbar"><span>手机结构预览</span><div><label>宽度 <select id="width"><option>320</option><option selected>390</option><option>430</option></select></label> <label>主题 <select id="theme"><option value="blue">晴空蓝</option><option value="jade">青竹绿</option><option value="night">墨夜</option></select></label></div></div><div class="phone" id="phone"><div class="samplebar"><span>新增页面</span><span>草图 · 示例数据</span></div><header class="apphead" id="apphead"></header><div class="body" id="content"></div><div id="foot"></div></div><div class="screenlabel" id="screenlabel"></div></section>
<aside class="notes" id="notes" aria-label="本页设计说明"></aside>
</div>
</main>
<dialog id="reuse-dialog"><h2 id="reuse-title">复用已有页面</h2><p id="reuse-copy"></p><div class="modal-actions"><button class="btn secondary" id="reuse-close">关闭说明</button><button class="btn" id="reuse-next" hidden>查看新增报告</button></div></dialog>
<script>
const $=s=>document.querySelector(s);
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const screens=[['collections','我的收藏'],['collection','字单详情'],['setup','专项配置'],['report','练习报告'],['review','复习中心'],['mistakes','错题本'],['records','我的学习'],['calendar','学习日历'],['day','当日明细'],['inbox','消息中心'],['reminders','学习提醒'],['reminder-edit','提醒编辑']];
const chars=[{glyph:'未',pinyin:'wèi',meaning:'还没有；不曾。',state:'2 次错误'},{glyph:'末',pinyin:'mò',meaning:'事物的最后部分。',state:'待复习'},{glyph:'己',pinyin:'jǐ',meaning:'自己。',state:'已学'},{glyph:'已',pinyin:'yǐ',meaning:'已经。',state:'待复习'},{glyph:'巳',pinyin:'sì',meaning:'地支的第六位。',state:'待巩固'}];
let current='collections',activeTab='chars',search='',manage=false,dueOnly=false,setName='字形易混字',practiceSource='字形易混字',reminderEnabled=true,reminderTime='20:30',draftReturn='collection';
const button=(label,to,secondary=false)=>`<button class="btn${secondary?' secondary':''}" data-go="${to}">${label}</button>`;
const row=(title,subtitle,to,badge='')=>`<button class="row" data-go="${to}"><span class="grow"><strong>${title}</strong><span class="small">${subtitle}</span></span>${badge?`<span class="badge">${badge}</span>`:''}<span class="chev">›</span></button>`;
function charRows(list=chars){return list.map(c=>`<${manage?'label':'button'} class="row" ${manage?'':'data-reuse="detail"'}>${manage?'<input type="checkbox" class="check" aria-label="选择'+c.glyph+'">':''}<span class="glyph">${c.glyph}</span><span class="grow"><strong>${c.glyph} <span class="small">${c.pinyin}</span></strong><span class="small">${c.meaning}</span></span><span class="badge">${c.state}</span>${manage?'':'<span class="chev">›</span>'}</${manage?'label':'button'}>`).join('');}
function header(title,back='collections'){ $('#apphead').innerHTML=`<button class="back" aria-label="返回" ${back==='existing'?'data-reuse="profile"':`data-go="${back}"`}>‹</button><h2>${title}</h2><span class="navspace" aria-hidden="true"></span>`; }
function footer(html=''){ $('#foot').innerHTML=html?`<div class="foot">${html}</div>`:''; }
const notes={
collections:[['从原占位入口进入','个人中心“我的收藏”位置、名称和外观不改，仅连接这个新页面。'],['列表之外还有完整流程','收藏字、字单和斩字分开管理，支持搜索、筛选、批量操作和专项练习。'],'原“我的收藏” → 新列表 → 字单 / 既有字详情'],
collection:[['先查看范围，再练习','说明、成员、状态和练习入口集中在新字单详情，不向原学习页增加卡片。'],['关系与记录分开','编辑或删除字单不会抹掉学习记录。点文字跳转原单字详情，原 UI 不变。'],'字单 → 编辑 / 管理成员 → 专项配置'],
setup:[['开始前明确练习合同','说明来源、数量、题型及排期影响，避免专项误改正式复习。'],['答题界面不重画','开始后复用已有题卡和反馈外观；本草图只标明这个边界。'],'专项配置 → 既有答题 UI → 新专项报告'],
report:[['仅新增报告页面','专项有自己的结果；原每日/关卡完成页不替换，历史报告从“我的学习”查看。'],['结果提供下一步','薄弱字可以再练，数据可追溯到当天记录，不只有一个完成提示。'],'报告 → 薄弱字专项 / 当日记录 / 字单'],
review:[['不改变原关卡复习入口','首页和个人中心的关卡复习仍直达原页面。新总览从新增“我的学习”进入。'],['跨来源总览有独立职责','查看到期字、错题和专项范围；实际关卡复习仍保留原字形和两个答案按钮。'],'新“我的学习” → 复习中心 → 旧复习 / 新错题本'],
mistakes:[['有来源与状态的错题本','按题型、时间、来源和巩固状态查看，可批量练习，不只是错误字列表。'],['不伪造历史细节','老数据只有累计次数时标明“历史累计”，逐题记录从真实事件产生。'],'错题列表 → 既有字详情 / 新专项配置'],
records:[['接通原“我的学习”','新增总览、记录与报告，不重新绘制首页，也不往原个人中心塞图表。'],['从汇总进入证据','累计、趋势、日历和会话明细相连，每个数字都能说明范围和来源。'],'原“我的学习” → 新总览 → 日历 / 报告 / 复习中心'],
calendar:[['新增日历模块','保留“我的日历”原菜单，新增月历、日期选择和当日明细。'],['日期和会话分层','月历展示活动日期，具体新学、复习、阅读记录在独立明细中查看。'],'原“我的日历” → 月历 → 当日明细 → 报告'],
day:[['一天内的真实记录','按来源区分新学、正式复习、专项和阅读，不把测评算作已学。'],['返回原功能仍保留外观','记录可以打开新报告，继续学习则复用已有学习界面。'],'日期 → 会话 / 阅读记录 → 报告或既有页面'],
inbox:[['接通已有消息图标','首页图标不改，仅补列表与详情；没有消息时有清楚的空状态。'],['离线也有真实消息','只记录真实提醒、计划和备份事件，不填虚构运营推送。'],'原消息图标 → 新消息中心 → 详情 / 提醒'],
reminders:[['原入口进入新模块','个人中心和设置里的“学习提醒”保持原样，打开同一套提醒数据。'],['平台能力明确','H5 提供应用内提醒及日历导出；系统通知需 Android 实机验收，不虚构成功。'],'原“学习提醒” → 提醒列表 → 编辑 / 权限状态'],
'reminder-edit':[['完整编辑与反馈','时间、星期、勿扰、完成后免打扰、开关和测试都在新页面。'],['不调整任何原设置页','现有设置的行、字号、顺序和样式保持，只连接本编辑流程。'],'提醒列表 → 编辑 → 保存 / 测试 → 列表']};
function render(id){current=id;footer();$('#content').scrollTop=0;$('#screen-nav').innerHTML=screens.map(([key,label],i)=>`<button data-go="${key}" ${key===id?'aria-current="page"':''}><b>${String(i+1).padStart(2,'0')}</b>${label}</button>`).join('');$('#screenlabel').textContent=(screens.find(s=>s[0]===id)?.[1]||'新增编辑页面')+' · 仅新页面草图';let html='';
if(id==='collections'){
header('我的收藏','existing');
html=`<div class="tabs" role="tablist" aria-label="收藏分类">${[['chars','收藏字'],['sets','自定义字单'],['slash','斩字管理']].map(([key,label])=>`<button role="tab" data-tab="${key}" aria-selected="${activeTab===key}" class="${activeTab===key?'selected':''}">${label}</button>`).join('')}</div>`;
if(activeTab==='sets'){html+=`<div class="sectionline"><span class="small">2 个字单</span><button class="textbutton" data-action="new-set">＋ 新建字单</button></div>${row(escapeText(setName),'5 字 · 3 字待巩固 · 昨天更新','collection')}${row('阅读中遇到的字','12 字 · 来自 3 本书','collection')}<p class="notice">字单只管理分组。删除字单不会删除学习记录，也不会取消收藏。</p>`;}else{html+=`<input class="field" id="char-search" aria-label="搜索文字" placeholder="搜索汉字或拼音" value="${escapeText(search)}"><div class="filters"><button class="chip ${dueOnly?'':'selected'}" data-action="all">全部</button><button class="chip ${dueOnly?'selected':''}" data-action="due">待复习</button><button class="textbutton" style="margin-left:auto" data-action="manage">${manage?'完成管理':'批量管理'}</button></div>${activeTab==='slash'?'<p class="notice">已斩文字可恢复参与学习，原学习记录保留。</p>':''}<div id="char-rows">${filteredRows()}</div>`;}
footer(manage?`<button class="btn full" data-action="remove-selected">${activeTab==='slash'?'恢复所选文字':'移除所选收藏'}</button>`:button('选择文字开始专项','setup')+'<p class="small">专项与正式复习排期分别处理</p>');
}
if(id==='collection'){
header('字单详情');html=`<div class="hero"><span class="label">我的自定义字单</span><h3>${escapeText(setName)}</h3><p>形近但意思不同的一组字。先比较细节，再练习辨认。</p><div class="mini"><span><b>5</b>文字</span><span><b>2</b>已学</span><span><b>3</b>待巩固</span></div><div class="actions"><button class="chip" data-action="edit-set">编辑字单</button><button class="chip" data-action="add-chars">＋ 添加文字</button></div></div><div class="sectionline"><h3>全部文字</h3><button class="textbutton" data-action="members">${manage?'完成管理':'管理成员'}</button></div><div id="member-rows">${charRows()}</div>`;footer(manage?'<button class="btn full" data-action="remove-members">移除所选成员</button>':button('开始字单专项','setup')+'<p class="small">本次专项默认不改变正式复习排期</p>');
}
if(id==='setup'){
header('专项配置','collection');html=`<span class="label">练习来源</span><h3 style="font-size:24px;margin:12px 0">${escapeText(practiceSource)}</h3><p class="small">本轮包含 5 个可练文字</p><label class="choice">练习方式<select aria-label="练习方式"><option>看学习字体选对照字形</option><option>看对照字体选学习字形</option><option>看字形输入文字</option></select></label><label class="choice">练习数量<select aria-label="练习数量"><option>全部 5 字</option><option>3 字</option></select></label><div class="choice">出题顺序<span>薄弱字优先</span></div><div class="choice">正式复习排期<span>保持当前排期</span></div><div class="sectionline"><h3>本次文字</h3></div><div class="actions">${chars.map(c=>`<span class="chip">${c.glyph}</span>`).join('')}</div><p class="notice">专项记录作答、错误和有效时长。未学文字不会因为完成专项直接算作正式学会。</p>`;footer('<button class="btn full" data-reuse="practice">开始专项（复用现有答题）</button>');
}
if(id==='report'){
header('练习报告','records');html=`<span class="label">字形易混字 · 专项完成</span><h3 style="font-size:23px;margin:17px 0 10px">这一轮，有了新进步。</h3><div class="stats"><div><span class="small">完成文字</span><strong>5<span> 字</span></strong></div><div><span class="small">首次答对</span><strong>4<span> / 5</span></strong></div><div><span class="small">有效时长</span><strong>3<span> 分</span></strong></div></div><div class="sectionline"><h3>还可以再巩固</h3><span class="small">1 字</span></div>${charRows([chars[0]])}<p class="notice">已保存本次记录。专项未改变正式复习排期，未计入正式复习目标。</p>${row('查看今天的学习记录','新学、复习与专项分别展示','day')}`;footer(`<div class="actions">${button('再练薄弱字','setup')}${button('返回字单','collection',true)}</div>`);
}
if(id==='review'){
header('复习中心','records');html=`<span class="label">当前到期 · 按单字去重</span><div class="bignum">24 <span>字</span></div><p class="small">同字来自多个课程时，共用一个正式排期。</p><button class="btn full" data-reuse="review">进入既有关卡复习</button><div class="sectionline"><h3>按薄弱项巩固</h3></div>${row('错题本','按题型、来源和巩固状态整理','mistakes','8 字')}${row('收藏与自定义字单','选择需要加强的一组文字','collections')}<div class="sectionline"><h3>今天正式复习</h3><button class="textbutton" data-go="day">明细</button></div><div class="stats"><div><span class="small">复习作答</span><strong>12<span> 次</span></strong></div><div><span class="small">认识</span><strong>9<span> 次</span></strong></div><div><span class="small">不认识</span><strong>3<span> 次</span></strong></div></div>`;
}
if(id==='mistakes'){
header('错题本','review');html=`<div class="filters"><button class="chip selected" data-action="wrong-all">待巩固</button><button class="chip" data-action="wrong-done">已巩固</button><button class="textbutton" style="margin-left:auto" data-action="manage">${manage?'结束管理':'选择'}</button></div><label class="choice">来源<select aria-label="错题来源"><option>全部学习来源</option><option>关卡学习</option><option>每日学习</option><option>专项练习</option></select></label><label class="choice">题型<select aria-label="错题题型"><option>全部题型</option><option>识形选择</option><option>文字输入</option></select></label><div class="sectionline"><h3>最近需要巩固</h3><span class="small">示例 5 字</span></div><div id="wrong-rows">${charRows()}</div><p class="notice">连续两次独立正确作答后标记已巩固，历史错误仍保留。</p>`;footer('<button class="btn full" data-action="practice-mistakes">开始错题专项</button>');
}
if(id==='records'){
header('我的学习','existing');html=`<span class="label">累计正式学习</span><div class="bignum">168 <span>字</span></div><p class="small">按单字去重 · 专项和测评不冒充首次学会</p><div class="stats"><div><span class="small">当前连续</span><strong>3<span> 天</span></strong></div><div><span class="small">有效时长</span><strong>86<span> 分</span></strong></div><div><span class="small">复习作答</span><strong>124<span> 次</span></strong></div></div><div class="sectionline"><h3>课程覆盖</h3><span class="small">一级汉字</span></div><div class="progress"><i style="width:4.8%"></i></div><p class="small">168 / 3500 字 · 4.8% · 示例数据</p>${row('学习日历','按日期查看新学、复习与阅读','calendar')}${row('复习中心','到期字与错题专项','review')}${row('最近一次练习','字形易混字 · 5 字 · 3 分钟','report')}${row('今天的全部记录','3 条学习活动','day')}`;
}
if(id==='calendar'){
header('我的日历','records');html=`<div class="sectionline"><h3>2026 年 11 月</h3><button class="textbutton" data-go="day">今天</button></div><div class="calendar">${['一','二','三','四','五','六','日'].map(w=>`<span class="weekday">${w}</span>`).join('')}${'<span></span>'.repeat(6)}${Array.from({length:30},(_,i)=>`<button data-go="day" class="${i===2?'today':i<2?'learned':''}" aria-label="11月${i+1}日">${i+1}</button>`).join('')}</div><p class="small">有学习记录的日期以主题色标记，同时显示记录数。</p><div class="sectionline"><h3>11 月 3 日 · 今天</h3><span class="small">3 条记录</span></div>${row('新学 8 字 · 正式复习 12 次','专项 5 字 · 有效学习 18 分钟','day')}<p class="notice">没有历史明细的日期显示“无记录”，不把累计次数平均分配到过去。</p>`;
}
if(id==='day'){
header('当日学习明细','calendar');html=`<span class="label">2026 年 11 月 3 日 · 周二</span><div class="stats"><div><span class="small">新学</span><strong>8<span> 字</span></strong></div><div><span class="small">正式复习</span><strong>12<span> 次</span></strong></div><div><span class="small">有效时长</span><strong>18<span> 分</span></strong></div></div><div class="timeline">${row('20:40 · 字形易混字专项','5 字 · 首次答对 4 题 · 3 分钟','report')}${row('20:20 · 关卡复习','12 次作答 · 5 分钟','report')}${row('19:30 · 今日新学','8 字 · 10 分钟 · 未完成','report')}</div><p class="notice">正式新学、复习、专项和阅读分别记录。点击会话可查看对应报告。</p>`;
}
if(id==='inbox'){
header('消息中心','existing');html=`<div class="sectionline"><span class="small">2 条消息 · 1 条未读</span><button class="textbutton" data-action="read-all">全部已读</button></div><div id="message-list"><button class="row" data-action="message-detail"><span class="grow"><strong><span class="dot"></span>今晚的学习时间到了</strong><span class="small">20:30 · 来自你设置的本地提醒</span></span><span class="chev">›</span></button><button class="row" data-action="backup-detail"><span class="grow"><strong>备份已保存</strong><span class="small">昨天 · 请另存一份到应用外</span></span><span class="chev">›</span></button></div><p class="notice">这里只显示真实发生的本地事件，不提供虚构运营通知。</p>${row('管理学习提醒','时间、星期与平台能力','reminders')}`;
}
if(id==='reminders'){
header('学习提醒','existing');html=`<div class="sectionline"><span class="small">本机提醒</span><button class="textbutton" data-go="reminder-edit">＋ 新建</button></div><button class="row" data-go="reminder-edit"><span class="grow"><strong style="font-size:25px">${reminderTime}</strong><span class="small">每天 · 字体学习</span></span><span class="badge">${reminderEnabled?'已启用':'已关闭'}</span><span class="chev">›</span></button><div class="sectionline"><h3>当前平台能力</h3></div><div class="choice">应用内提醒<span>可用</span></div><div class="choice">关闭网页后系统唤醒<span>H5 不保证</span></div><button class="row" data-action="calendar-export"><span class="grow"><strong>导出日历提醒</strong><span class="small">使用本机日历的通知能力</span></span><span class="chev">›</span></button><p class="notice">Android 系统通知会单独验证权限、排程、取消和设备重启。本草图不代表系统通知已实现。</p>`;
}
if(id==='reminder-edit'){
header('编辑学习提醒','reminders');html=`<label class="formfield">提醒时间<input id="reminder-time" type="time" value="${reminderTime}"></label><label class="choice">重复<select aria-label="重复日期"><option>每天</option><option>工作日</option><option>周末</option></select></label><label class="choice">启用提醒<input id="reminder-enabled" type="checkbox" class="check" ${reminderEnabled?'checked':''}></label><label class="choice">当天完成目标后不提醒<input type="checkbox" class="check" checked></label><div class="choice">勿扰时段<span>22:00 – 08:00</span></div><button class="row" data-action="test-reminder"><span class="grow"><strong>发送测试提醒</strong><span class="small">实际版本显示真实测试结果</span></span><span class="chev">›</span></button><div id="reminder-status" class="small" role="status"></div><p class="notice">保存时撤销旧排程再建立新排程。关闭提醒时移除待触发通知。</p>`;footer('<button class="btn full" data-action="save-reminder">保存提醒</button>');
}
$('#content').innerHTML=html;const n=notes[id]||[['只新增编辑界面','原入口与原页面 UI 保持不变。'],['草图交互仅用于评审','正式实现需要校验、保存和失败反馈。'],'新页面 → 保存 → 返回'];$('#notes').innerHTML=`<h2>本页职责与复用边界</h2>${n.slice(0,2).map(a=>`<section class="noteblock"><h3>${a[0]}</h3><p>${a[1]}</p></section>`).join('')}<div class="route"><b>当前流程</b>${n[2]}</div>`;
}
function filteredRows(){const list=chars.filter(c=>(c.glyph.includes(search)||c.pinyin.includes(search))&&(!dueOnly||c.state==='待复习'));return list.length?charRows(list):'<div class="empty">没有匹配的文字<br><span class="small">换个汉字或拼音，或清除筛选</span></div>';}
function showReuse(kind){const copy={profile:'这里返回现有个人中心。原菜单、资料区、布局、颜色和字号全部保留，本草图不重新绘制。',detail:'这里打开现有单字详情页。只传入单字 ID，复用原字形、释义、收藏等 UI，不提供替代设计。',practice:'这里进入复用既有题卡与反馈外观的专项会话。本草图不重绘答题界面。完成后可查看新增的专项报告。',review:'这里打开现有关卡复习。保留学习字体、认识/不认识、三种范围筛选与原有返回方式，不插入新界面。'};$('#reuse-title').textContent='复用已有页面 · UI 不变';$('#reuse-copy').textContent=copy[kind];$('#reuse-next').hidden=kind!=='practice';$('#reuse-dialog').showModal();}
function editSet(action){draftReturn=current;header(action==='new-set'?'新建字单':action==='add-chars'?'添加文字':'编辑字单',draftReturn);$('#content').innerHTML=`<label class="formfield">${action==='add-chars'?'要添加的汉字':'字单名称'}<input id="set-input" maxlength="30" value="${action==='edit-set'?escapeText(setName):''}" placeholder="${action==='add-chars'?'例如：未末己已巳':'1–30 字'}"></label><label class="formfield">说明（可选）<textarea rows="4" placeholder="记录学习这组字的原因"></textarea></label><p class="notice">正式版本会校验重复字、未收录字和保存错误。本草图只演示新增页面的流程。</p><p id="edit-feedback" class="small" role="status"></p>`;footer(`<button class="btn full" data-action="save-set" data-kind="${action}">保存并返回</button>`);}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){manage=false;render(b.dataset.go)}if(b.dataset.reuse)showReuse(b.dataset.reuse);if(b.dataset.tab){activeTab=b.dataset.tab;search='';manage=false;render('collections')}const a=b.dataset.action;if(a==='due'||a==='all'){dueOnly=a==='due';render('collections')}if(a==='manage'){manage=!manage;render(current)}if(a==='members'){manage=true;render('collection')}if(a==='new-set'||a==='edit-set'||a==='add-chars')editSet(a);if(a==='save-set'){const value=$('#set-input').value.trim();if(!value){$('#edit-feedback').textContent='请先填写内容。';return;}if(b.dataset.kind!=='add-chars')setName=value;manage=false;render('collection')}if(a==='remove-selected'){const checked=document.querySelectorAll('.row .check:checked').length;$('#char-rows').innerHTML=checked?'<p class="notice">草图已演示批量操作。正式版本会确认范围、保存并支持失败重试。</p>':'<p class="notice">请先选择文字，再执行批量操作。</p>';}if(a==='practice-mistakes'){practiceSource='错题专项';manage=false;render('setup')}if(a==='wrong-done')$('#wrong-rows').innerHTML='<div class="empty">暂无已巩固的错题<br><span class="small">完成错题练习后会显示在这里</span></div>';if(a==='wrong-all')$('#wrong-rows').innerHTML=charRows();if(a==='save-reminder'){reminderTime=$('#reminder-time').value||'20:30';reminderEnabled=$('#reminder-enabled').checked;render('reminders')}if(a==='test-reminder')$('#reminder-status').textContent='这是草图反馈，未实际发送通知。正式版本会检测权限并反馈测试结果。';if(a==='read-all')document.querySelectorAll('.dot').forEach(dot=>dot.remove());if(a==='message-detail'||a==='backup-detail'){header('消息详情','inbox');$('#content').innerHTML=`<span class="label">本地事件 · 示例</span><h3>${a==='message-detail'?'今晚的学习时间到了':'备份已保存'}</h3><p class="small">${a==='message-detail'?'这是你设置的本机学习提醒，可以查看计划后继续原学习流程。':'请将文件另存到应用外。当前应用私有目录中的备份不能保证卸载后保留。'}</p>${a==='message-detail'?'<button class="btn full" data-reuse="practice">前往原学习界面</button>':button('查看当日记录','day')}`;}if(a==='calendar-export'){header('日历提醒导出','reminders');$('#content').innerHTML='<p class="notice">正式版本生成包含时间、重复规则和提醒说明的 .ics 文件，交由本机日历导入。本草图不生成真实文件。</p>'+button('返回提醒列表','reminders');}});
document.addEventListener('input',event=>{if(event.target.id==='char-search'){search=event.target.value;$('#char-rows').innerHTML=filteredRows();}});
$('#reuse-close').addEventListener('click',()=>$('#reuse-dialog').close());$('#reuse-next').addEventListener('click',()=>{$('#reuse-dialog').close();render('report')});
$('#width').addEventListener('change',event=>{$('#phone').style.width=event.target.value+'px'});
$('#theme').addEventListener('change',event=>{const t={blue:['#1755e9','#e7edff','#fff','#f7f8fa','#20242d','#66707e','#e7eaf0','#fff'],jade:['#16856b','#dff5ed','#fbfdfb','#eef6f2','#20342e','#5e746d','#dce9e3','#fff'],night:['#7da2ff','#26375c','#151922','#202633','#f1f4fa','#bac2d0','#303847','#101624']};['primary','soft','page','surface','text','muted','border','on'].forEach((key,i)=>document.documentElement.style.setProperty('--'+key,t[event.target.value][i]));});
render('collections');
document.addEventListener('click',event=>{const action=event.target.closest('button')?.dataset.action;if(action==='remove-members'){const selected=[...document.querySelectorAll('#member-rows .check:checked')];if(!selected.length){$('#member-rows').insertAdjacentHTML('afterbegin','<p class="notice">请先选择要移除的文字。</p>');return;}selected.forEach(input=>input.closest('.row').remove());$('#member-rows').insertAdjacentHTML('afterbegin','<p class="notice">草图已演示移除所选成员；学习记录保留。正式版本会确认并保存。</p>');}});
</script>
</body>
</html>
